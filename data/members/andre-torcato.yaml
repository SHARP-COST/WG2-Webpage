expertise: Functional QCD calculations of baryon spectra using quark-diquark Bethe-Salpeter
  equations.
current_interests: I'm interested in studying baryons using functional methods. Specifically,
  solving the baryon's Bethe-Salpeter equation using a quark-diquark model to simplify
  it to a 2-body system. With this, not only is it possible to calculate baryon masses,
  but diquark correlations as well. My focus is to predict the diquark correlations
  of baryons with quarks of different flavors.
