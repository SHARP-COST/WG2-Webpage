name: Project Checks

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "site/**"
      - "data/**"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    paths:
      - "scripts/**"
      - "site/**"
      - "data/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate data and site bundle consistency
        run: python3 scripts/check_health.py
